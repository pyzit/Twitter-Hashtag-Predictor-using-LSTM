<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitter Hashtag Predictor</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background-color: #f2f2f2; }
        input[type="text"] { width: 50%; padding: 10px; font-size: 16px; }
        input[type="submit"] { padding: 10px 20px; font-size: 16px; margin-left: 10px; }
        .hashtags { margin-top: 20px; font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <h1>Twitter Hashtag Predictor</h1>
    <form method="post">
        <input type="text" name="tweet" placeholder="Enter your tweet" value="{{ tweet }}">
        <input type="submit" value="Predict">
    </form>
    {% if hashtags %}
        <div class="hashtags">
            <strong>Suggested Hashtags:</strong>
            {{ hashtags | join(', ') }}
        </div>
    {% endif %}
</body>
</html>
